name: Debian packages

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            series: noble
            arch: amd64
            runner: ubuntu-24.04
          - ubuntu: '24.04'
            series: noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - ubuntu: '26.04'
            series: resolute
            arch: amd64
            runner: ubuntu-24.04
          - ubuntu: '26.04'
            series: resolute
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates git devscripts equivs lintian
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install package build dependencies
        run: mk-build-deps --install --remove --tool 'apt-get --yes --no-install-recommends' debian/control
      - name: Check release version and set distribution suffix
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
          UBUNTU_SERIES: ${{ matrix.series }}
          DEBFULLNAME: John Pye
          DEBEMAIL: john.pye@anu.edu.au
        run: |
          version=$(dpkg-parsechangelog --show-field Version)
          if [ "$REF_TYPE" = tag ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag must match debian/changelog: v$version" >&2
            exit 1
          fi
          # Distribution versions keep release assets distinct.
          dch --newversion "$version+ubuntu$UBUNTU_VERSION" --distribution "$UBUNTU_SERIES" \
            --force-distribution 'Build for this Ubuntu release.'
      - name: Build and test package
        run: dpkg-buildpackage --build=binary --no-sign
      - name: Validate package
        run: |
          for package in ../network-manager-gpclient_*.deb; do
            tools/test-deb.sh "$package"
            lintian --allow-root --fail-on error "$package"
          done
      - name: Collect package
        run: |
          mkdir -p dist
          cp ../network-manager-gpclient_*.deb dist/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Prepare GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Prepare source archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="network-manager-gpclient-${RELEASE_TAG#v}/" \
            HEAD > "dist/network-manager-gpclient_${RELEASE_TAG#v}.tar.gz"
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS
      - name: Create draft release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file debian/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
